*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Layout wrapper ───────────────────────────────────────── */
.wrap {

}

/* ── Header ───────────────────────────────────────────────── */
.site-header {

.header-inner {

.site-name {

.filters {

}

.chip:hover { background: var(--accent-lt); color: var(--accent); }

/* ── Grid ─────────────────────────────────────────────────── */
main {
  padding-block: 36px 60px;
}

.recipe-grid {

}

.empty-state {

  text-align: center;
  padding: 80px 24px;
  color: var(--text-2);
}

.empty-state p:first-child {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.4rem;
  margin-bottom: 8px;
}

.empty-state p:last-child {
  font-size: .9rem;
}

/* ── Card ─────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;

  transition: transform .18s, box-shadow .18s;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--sh-up);
}

.card:focus-visible {
  outline: 2px solid var(--accent);

}

.card-band {

  overflow: hidden;

.card-band::before {
  content: attr(data-cuisine);
  position: absolute;
  right: -4px;
  bottom: -8px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 3.2rem;
  font-weight: 600;

  pointer-events: none;
  letter-spacing: -.02em;
}

.card-cuisine-label {
  font-size: .68rem;
  font-weight: 700;

  color: rgba(255,255,255,.9);
  font-family: 'Nunito Sans', sans-serif;
}

.card-body {
  padding: 18px 18px 16px;

  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.card-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.2;
  color: var(--text);
  text-wrap: balance;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-size: .78rem;
  color: var(--text-2);
}

.meta-sep { opacity: .4; }

.card-desc {
  font-size: .88rem;
  color: var(--text-2);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}

.tag {
  padding: 2px 9px;
  border-radius: 100px;
  background: var(--tag-bg);
  color: var(--tag-t);
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .02em;
}

/* ── Modal ────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-inline: 16px;
  padding-bottom: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-card {
  background: var(--surface-up);
  border-radius: 14px 14px 0 0;
  width: 100%;
  max-width: 760px;
  max-height: 92dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  transform: translateY(40px);
  transition: transform .25s cubic-bezier(.22,.61,.36,1);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.modal-overlay.open .modal-card {
  transform: translateY(0);
}

.modal-band {

  align-items: flex-end;
  padding: 14px 24px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

  font-style: italic;

  font-weight: 600;

}

.modal-cuisine-label {

  color: rgba(255,255,255,.88);
}

.modal-inner {
  padding: 24px 28px 40px;

  flex-direction: column;
  gap: 24px;
}

.modal-stats {

  padding-block: 14px;
}

.modal-stats strong { color: var(--text); }

.modal-desc {
  font-size: .95rem;
  line-height: 1.7;
  color: var(--text-2);
}

.modal-cols {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 32px;
  align-items: start;
}

.col-head {
  font-family: 'Cormorant Garamond', serif;

.ingredient-list li {

.instruction-list {

  gap: 14px;

.step {

  line-height: 1.65;

}

.step-num {

  font-weight: 700;

  line-height: 1.6;
  color: var(--text);
}

.modal-notes strong {
  font-family: 'Cormorant Garamond', serif;

.modal-close-row {

.modal-close {

.modal-close:hover { background: var(--accent-lt); color: var(--accent); }
.modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 640px) {
  .header-inner { flex-wrap: wrap; gap: 12px; }

  .site-name { font-size: 1.5rem; }

  .modal-cols {

  .modal-title { font-size: 1.7rem; }
}

/* ── Loading ──────────────────────────────────────────────── */
.loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 24px;
  color: var(--text-2);
  font-family: 'Courier Prime', monospace;
  font-size: .9rem;
  letter-spacing: .05em;
}

/* ── Reduced motion ───────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .card, .modal-overlay, .modal-card { transition: none; }
}

// ── State ───────────────────────────────────────────────────
let RECIPES = [];
let activeFilter = 'All';
let searchQuery = '';

// ── Load ────────────────────────────────────────────────────
async function loadRecipes() {
  try {
    const res = await fetch('./recipes.json');
    if (!res.ok) throw new Error('not found');
    RECIPES = await res.json();
  } catch {
    RECIPES = EMBEDDED;
  }
  init();
}

// ── Init ────────────────────────────────────────────────────
function init() {
  renderFilters();
  renderGrid();
}

// ── Filters ─────────────────────────────────────────────────
function renderFilters() {
  const cuisines = ['All', ...new Set(RECIPES.map(r => r.cuisine))];
  const container = document.getElementById('filters');
  container.innerHTML = cuisines.map(c => `
    <button
      class="chip${c === activeFilter ? ' active' : ''}"
      data-cuisine="${c}"
      role="listitem"
      aria-pressed="${c === activeFilter}"
    >${c}</button>
  `).join('');

  container.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.cuisine;
      container.querySelectorAll('.chip').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn);
      });
      renderGrid();
    });
  });
}

// ── Grid ────────────────────────────────────────────────────
function filterRecipes() {
  const q = searchQuery.toLowerCase();
  return RECIPES.filter(r => {
    const matchesCuisine = activeFilter === 'All' || r.cuisine === activeFilter;
    if (!q) return matchesCuisine;
    const searchable = [r.title, r.cuisine, r.category, r.description, ...r.tags, ...r.ingredients].join(' ').toLowerCase();
    return matchesCuisine && searchable.includes(q);
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const filtered = filterRecipes();

  count.textContent = `${filtered.length} recipe${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <p>Nothing found.</p>
        <p>Try a different search or clear the filter.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(cardHTML).join('');
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(+card.dataset.id));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(+card.dataset.id); }
    });
  });
}

function cardHTML(r) {
  const total = r.prepTime + r.cookTime;
  const color = CUISINE_COLORS[r.cuisine] || defaultColor;
  const tags = r.tags.slice(0, 4).map(t => `<span class="tag">${t}</span>`).join('');
  return `
    <article class="card" data-id="${r.id}" tabindex="0" role="listitem" aria-label="${r.title}">
      <div class="card-band" style="background:${color}" data-cuisine="${r.cuisine}">
        <span class="card-cuisine-label">${r.cuisine}</span>
      </div>
      <div class="card-body">
        <h3 class="card-title">${r.title}</h3>
        <div class="card-meta">
          <span>${total} min</span>
          <span class="meta-sep">·</span>
          <span>serves ${r.servings}</span>
          <span class="meta-sep">·</span>
          <span>${r.difficulty}</span>
        </div>
        <p class="card-desc">${r.description}</p>
        <div class="card-tags">${tags}</div>
      </div>
    </article>`;
}

// ── Modal ───────────────────────────────────────────────────
let prevFocus = null;

function openModal(id) {
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;

  prevFocus = document.activeElement;
  const color = CUISINE_COLORS[r.cuisine] || defaultColor;
  const total = r.prepTime + r.cookTime;

  document.getElementById('modal-band').style.background = color;
  document.getElementById('modal-band').dataset.cuisine = r.cuisine;
  document.getElementById('modal-cuisine').textContent = r.cuisine.toUpperCase();
  document.getElementById('modal-title').textContent = r.title;
  document.getElementById('modal-desc').textContent = r.description;

  document.getElementById('modal-stats').innerHTML = `
    <span>⏱ <strong>${r.prepTime} min</strong> prep</span>
    <span>🍳 <strong>${r.cookTime} min</strong> cook</span>
    <span>⏳ <strong>${total} min</strong> total</span>
    <span>🍽 <strong>Serves ${r.servings}</strong></span>
    <span>📊 <strong>${r.difficulty}</strong></span>
  `;

  document.getElementById('modal-ingredients').innerHTML =
    r.ingredients.map(i => `<li>${i}</li>`).join('');

  document.getElementById('modal-steps').innerHTML =
    r.instructions.map((step, i) => `
      <li class="step">
        <span class="step-num">${String(i + 1).padStart(2, '0')}</span>
        <span>${step}</span>
      </li>`).join('');

  const notesEl = document.getElementById('modal-notes');
  if (r.notes) {
    document.getElementById('modal-notes-text').textContent = r.notes;
    notesEl.hidden = false;
  } else {
    notesEl.hidden = true;
  }

  // Scroll modal to top
  document.getElementById('modal-card').scrollTop = 0;

  const overlay = document.getElementById('modal');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal-close').focus();
}

function closeModal() {
  const overlay = document.getElementById('modal');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  if (prevFocus) prevFocus.focus();
}

// ── Event listeners ─────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderGrid();
});

document.getElementById('modal-close').addEventListener('click', closeModal);

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')) closeModal();
});

// ── Boot ─────────────────────────────────────────────────────
loadRecipes();
</script>
